# =========================================================================
# Orange Cab - Production Nginx Reverse Proxy & SSL Configuration
# Domains:
#   - Public Website: orangecab.in / www.orangecab.in
#   - Admin Console:  admin.orangecab.in
#   - API Backend:    api.orangecab.in
# =========================================================================

# Upstream Backend API
upstream orangecab_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# 1. API Subdomain (api.orangecab.in)
server {
    listen 80;
    listen [::]:80;
    server_name api.orangecab.in;

    # Redirect HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://orangecab_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}

# 2. Admin Console Subdomain (admin.orangecab.in)
server {
    listen 80;
    listen [::]:80;
    server_name admin.orangecab.in;

    root /var/www/orangecab/admin/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy Fallback
    location /api/ {
        proxy_pass http://orangecab_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 3. Public Website (orangecab.in)
server {
    listen 80;
    listen [::]:80;
    server_name orangecab.in www.orangecab.in;

    root /var/www/orangecab/client/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy
    location /api/ {
        proxy_pass http://orangecab_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin console fallback paths
    location = /admin {
        return 301 http://admin.orangecab.in/login;
    }

    location /admin/login {
        return 301 http://admin.orangecab.in/login;
    }

    # SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
