# =========================================================================
# Orange Cab - Production Nginx Reverse Proxy & SSL Configuration
# Domains:
#   - Public Website and Admin Console: orangecabs.in / www.orangecabs.in
#   - API Backend:                     api.orangecab.in
# =========================================================================

# Upstream Backend API
upstream orangecab_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# 1. API Subdomain (api.orangecab.in)
server {
    listen 80;
    listen [::]:80;
    server_name api.orangecab.in;

    # Redirect HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://orangecab_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}

# 2. Public Website and Admin Console (orangecabs.in)
server {
    listen 80;
    listen [::]:80;
    server_name orangecabs.in www.orangecabs.in;

    root /var/www/orangecab/deployment/vercel-output/client;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy
    location /api/ {
        proxy_pass http://orangecab_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin app is built into client/dist/admin by the combined Vercel build.
    location = /admin {
        return 301 /admin/login;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Public SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
